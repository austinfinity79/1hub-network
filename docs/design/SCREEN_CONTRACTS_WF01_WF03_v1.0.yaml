version: '1.0'
status: FROZEN_WF01_WF03
workflows:
  WF01:
    name: Identity & Onboarding
    mode: PRODUCTION
    actor: Guest -> Member/Leader
    screens:
    - id: WF01-S01
      route: /auth
      source: AUTH1
      reads: []
      writes:
      - AuthRequest
      actions:
      - continue_google_if_configured
      - send_magic_link
      next:
      - WF01-S02
      notes:
      - Email magic-link is required P0 path; provider auth is config-driven.
    - id: WF01-S02
      route: /auth/check-email
      source: AUTH2
      reads:
      - AuthRequest
      writes:
      - AuthRequest
      actions:
      - resend
      - change_email
      next:
      - WF01-S03
      - WF01-S04
    - id: WF01-S03
      route: /auth/callback
      source: AUTH3
      reads:
      - AuthToken
      writes:
      - UserAccount
      - Session
      actions:
      - activate_session
      - request_new_link
      next:
      - WF01-S09
      - WF01-S04
    - id: WF01-S04
      route: /auth/error
      source: AUTH4
      reads:
      - AuthErrorState
      writes: []
      actions:
      - retry
      - contact_support
      - relogin
      next:
      - WF01-S01
      - WF01-S02
    # Four-stage onboarding (TASK 22-L1-L2-SOT-REALIGN, DEC-L1R): the L1 board of
    # 28/09 and the BA workbook (sheet "2. Actor", WF-01) supersede ONB1-ONB3.
    # WF01-S05..S08 keep their ids and routes; S09 and S10 are new. Flow order:
    # S09 -> S06 -> S10 -> S05 -> S07 -> S08.
    - id: WF01-S05
      route: /onboarding/purpose
      source: ACC-08
      supersedes: ONB1
      reads:
      - UserAccount
      - DeclaredRole
      - Organization
      writes:
      - DeclaredRole
      - HubUnitClaimDraft
      - OnboardingStage
      actions:
      - select_ecosystem_roles
      - name_hub_unit_position
      - save_and_finish_later
      - continue
      next:
      - WF01-S07
      notes:
      - Stage 3 of 4. A declaration grants no membership, leadership, role or capability.
    - id: WF01-S06
      route: /onboarding/profile
      source: ACC-06
      supersedes: ONB2
      reads:
      - UserAccount
      - IndividualProfile
      - ControlledVocabulary
      writes:
      - IndividualProfile
      actions:
      - upload_avatar
      - save_basic_information
      - save_and_finish_later
      - continue
      next:
      - WF01-S10
      notes:
      - Stage 1 of 4. AI suggestion is drawn and inert until a provider is configured.
    - id: WF01-S07
      route: /onboarding/privacy
      source: ACC-09
      supersedes: ONB3
      reads:
      - IndividualProfile
      - DeclaredRole
      - ProfileCompletion
      - ConsentVersion
      - ProfileVisibilitySetting
      writes:
      - ConsentRecord
      - ProfileVisibilitySetting
      - OnboardingCompletion
      - CommunityMembership
      actions:
      - edit_stage
      - set_network_visibility
      - accept_required_legal
      - save_and_finish_later
      - complete_profile
      next:
      - WF01-S08
      notes:
      - Stage 4 of 4. Visibility and consent are separate controls.
      - Completion files the named HUB units as PENDING_APPROVAL membership requests.
    - id: WF01-S08
      route: /onboarding/complete
      source: ACC-10
      supersedes: ONB4
      reads:
      - IndividualProfile
      - ProfileCompletion
      - CommunityMembership
      writes: []
      actions:
      - create_project_profile
      - open_hub_verification_status
      - open_account_home
      next:
      - WF02-S01
    - id: WF01-S09
      route: /onboarding
      source: ACC-05
      reads:
      - UserAccount
      writes: []
      actions:
      - start
      - later
      next:
      - WF01-S06
      notes:
      - Entry to the four-stage flow. AI block is drawn and inert.
    - id: WF01-S10
      route: /onboarding/capability
      source: ACC-07
      reads:
      - IndividualProfile
      - ControlledVocabulary
      writes:
      - IndividualProfile
      - OnboardingStage
      actions:
      - select_domains
      - select_specializations
      - select_skills
      - edit_experience
      - save_links
      - save_and_finish_later
      - continue
      next:
      - WF01-S05
      notes:
      - Stage 2 of 4. Skills come from the controlled vocabulary, never free text.
    future_insertion:
      after: WF01-S03
      capability: 1Hub verified identity / CCCD verification
      p0: NOT_REQUIRED
  WF02:
    name: Member Profile & Network Management
    mode: PRODUCTION
    actor: Member/Leader
    screens:
    - id: WF02-S01
      route: /me
      source: ME0
      reads:
      - UserAccount
      - IndividualProfile
      - Membership
      - Leadership
      - Invitations
      writes: []
      actions:
      - open_profile
      - open_privacy
      - open_roles
      - open_project
      - open_settings
    - id: WF02-S02
      route: /me/profile/edit
      source: PRO2
      reads:
      - IndividualProfile
      - ControlledVocabulary
      - ActivityReadModel
      writes:
      - IndividualProfile
      actions:
      - save
      - preview_public
    - id: WF02-S03
      route: /me/privacy
      source: ME2
      reads:
      - ConsentRecord
      - ProfileVisibilitySetting
      - ProfileViewerLog
      writes:
      - ProfileVisibilitySetting
      - ConsentRecord
      actions:
      - toggle_purpose
      - preview_as_other
      - export_my_data
    - id: WF02-S04
      route: /me/roles
      source: ME6
      reads:
      - Membership
      - Leadership
      - RoleAssignment
      - ActivityRecord
      writes: []
      actions:
      - open_linked_entity
      notes:
      - system-recorded history is read-only
    - id: WF02-S05
      route: /projects/:id/edit | /projects/new
      source: PRO1
      reads:
      - ProjectStartup
      - ControlledVocabulary
      writes:
      - ProjectStartup
      actions:
      - create
      - save
      - preview_public
      - submit_for_review_if_required
      notes:
      - Canonical Project/Startup reused by WF05; no per-programme duplicate.
    - id: WF02-S06
      route: /projects/:id/team
      source: PRO3
      reads:
      - ProjectStartup
      - TeamMembership
      - IndividualProfile
      writes:
      - TeamMembership
      actions:
      - invite_member
      - change_role
      - remove_member_if_allowed
    - id: WF02-S07
      route: /me/settings
      source: ME4
      reads:
      - UserAccount
      - Session
      - NotificationPreference
      writes:
      - UserAccountSettings
      - NotificationPreference
      actions:
      - update_email_or_provider_if_supported
      - manage_sessions
      - request_account_deletion
  WF03:
    name: HUB / Chapter / CLB Operations
    mode: PRODUCTION_INTERNAL
    actor: HUB Leader / Chapter Admin / Authorized Representative
    screens:
    - id: WF03-S01
      route: /ops/network
      source: ADM8
      reads:
      - Organization
      - MembershipSummary
      writes: []
      scope:
      - network:read
      actions:
      - select_org
      - open_members
    - id: WF03-S02
      route: /ops/org/:orgId
      source: ORG1
      reads:
      - OrganizationOpsReadModel
      writes: []
      scope:
      - org:read
      actions:
      - open_work_item
      - navigate_module
    - id: WF03-S03
      route: /ops/org/:orgId/members
      source: ADM17
      reads:
      - Membership
      - IndividualProfile
      writes: []
      scope:
      - member:read
      actions:
      - search
      - filter
      - open_member
    - id: WF03-S04
      route: /ops/org/:orgId/members/:profileId
      source: ADM18
      reads:
      - IndividualProfile
      - Membership
      - Leadership
      - ConsentSummary
      writes:
      - Membership
      - Leadership
      scope:
      - member:read
      - member:manage_if_authorized
      actions:
      - approve_or_update_relationship_if_allowed
    - id: WF03-S05
      route: /ops/org/:orgId/programmes
      source: ADM5
      reads:
      - Programme
      writes: []
      scope:
      - programme:read
      actions:
      - open_programme
      - create_programme_if_capability
    - id: WF03-S06
      route: /ops/org/:orgId/profile
      source: ORGP2
      reads:
      - Organization
      - OrganizationProfile
      writes:
      - OrganizationProfile
      scope:
      - org:manage
      actions:
      - edit_profile_sections
      - save
      - archive_if_allowed
    - id: WF03-S07
      route: /ops/org/:orgId/events
      source: Chapter Summit admin crop
      reads:
      - Event
      - EventRegistration
      - EventOpsReadModel
      writes:
      - Event
      scope:
      - event:manage
      actions:
      - create_event
      - edit_event
      - publish_event
      - manage_registration
      notes:
      - 'Frozen rename: Quản lý sự kiện. Do not implement generic Activity CRUD.'
    - id: WF03-S08
      route: /ops/org/:orgId/settings
      source: ADM21
      reads:
      - OrganizationRelationship
      writes:
      - OrganizationRelationship
      scope:
      - org:manage_relationship
      actions:
      - create_relationship
      - close_relationship_preserve_history
    - id: WF03-S09
      route: /organizations/:slug
      source: Hồ sơ Chapter crop
      reads:
      - OrganizationPublicReadModel
      - EventPublicReadModel
      writes: []
      scope:
      - public_or_network_visibility
      actions:
      - request_join
      - open_event
      - open_related_org
