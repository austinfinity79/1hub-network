# /etc/nginx/sites-available/00-default-deny — replaces Ubuntu's `default`.
# Only 1hubnetwork.io.vn is served. Any other Host (bare IP, scanners, other
# names) gets the connection closed; TLS without a matching SNI is refused.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    return 444;
}
