# 1hub.network P0 — reverse proxy to the app on 127.0.0.1:3100.
# Certbot adds the 443 server and the HTTP->HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name 1hubnetwork.io.vn;

    # Avatar limit is 2 MiB (MEDIA_AVATAR_MAX_BYTES) plus multipart overhead.
    client_max_body_size 3m;
    autoindex off;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
