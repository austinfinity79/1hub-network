# 1hub.network P0 — origin behind OneShield/WAF. Proxies to the app on
# 127.0.0.1:3100.
#
# Port 80 does NOT redirect to HTTPS: OneShield terminates the browser's TLS
# and may reach this origin over plain HTTP, so an origin redirect would loop.
# The browser-facing HTTP->HTTPS redirect is done by OneShield. Port 443 serves
# the origin certificate (certbot certonly, HTTP-01) for OneShield->origin TLS.

# Keep the browser-facing protocol reported by OneShield; fall back to ours.
map $http_x_forwarded_proto $onehub_forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    listen [::]:80;
    # nginx 1.24 (Ubuntu 24.04): http2 is a listen parameter, not a directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 1hubnetwork.io.vn;

    ssl_certificate     /etc/letsencrypt/live/1hubnetwork.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1hubnetwork.io.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Avatar limit is 2 MiB (MEDIA_AVATAR_MAX_BYTES) plus multipart overhead.
    client_max_body_size 3m;
    autoindex off;
    # Redacts the magic-link token (conf.d/onehub-logging.conf).
    access_log /var/log/nginx/access.log onehub;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $onehub_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
