# /etc/nginx/conf.d/onehub-logging.conf — access log without secrets.
# The magic-link callback carries the raw one-time token in its query string;
# it must never reach a log file. Any query on /auth/callback is replaced, in
# the request line and in the Referer (assets loaded by the callback page).
map $request_uri $onehub_log_uri {
    ~^(?<onehub_cb>/auth/callback)\?  "$onehub_cb?<redacted>";
    default                           $request_uri;
}
map $http_referer $onehub_log_referer {
    ~^(?<onehub_ref>.*/auth/callback)\?  "$onehub_ref?<redacted>";
    default                            $http_referer;
}
log_format onehub '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $onehub_log_uri $server_protocol" $status $body_bytes_sent '
                  '"$onehub_log_referer" "$http_user_agent"';
