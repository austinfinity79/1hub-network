# /etc/nginx/conf.d/onehub-realip.conf — client IP behind OneShield/WAF.
# Trust X-Real-IP ONLY from the OneShield edges observed connecting to this
# origin (2026-09-26). A direct client cannot spoof it. Update this list when
# OneShield publishes or changes its egress ranges.
set_real_ip_from 103.56.163.10;
set_real_ip_from 103.166.183.10;
set_real_ip_from 103.216.118.10;
real_ip_header X-Real-IP;
